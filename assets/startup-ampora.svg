<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="100%" height="140">
  <defs>
    <linearGradient id="ampJungleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041810" />
      <stop offset="100%" stop-color="#082b1c" />
    </linearGradient>
    <linearGradient id="ampLeafGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="amGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Border & Background -->
  <rect x="2" y="2" width="446" height="136" rx="12" fill="url(#ampJungleBg)" stroke="#14b8a6" stroke-width="1.8" stroke-opacity="0.8" />
  
  <!-- Foliage Accent Line -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#facc15" stroke-width="2" />
  <circle cx="60" cy="20" r="2.5" fill="#facc15" />

  <!-- Logo Emblem: Sprout & Mentorship Spark -->
  <g transform="translate(48, 70)">
    <circle cx="0" cy="0" r="20" fill="#064e3b" stroke="url(#ampLeafGrad)" stroke-width="2" filter="url(#amGlow)" />
    <!-- Sprout Leaves -->
    <path d="M 0 10 Q -6 0, -10 -4 Q -2 -10, 0 10 Z" fill="#facc15" />
    <path d="M 0 10 Q 6 0, 10 -4 Q 2 -10, 0 10 Z" fill="#00f59b" />
  </g>

  <!-- Typography with clear placement (NO OVERLAP) -->
  <g transform="translate(88, 48)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="2.5">AMPORA</text>
    <!-- Badge placed with clear 25px offset past word width -->
    <rect x="135" y="-14" width="96" height="18" rx="4" fill="#facc15" fill-opacity="0.18" stroke="#facc15" stroke-width="1" />
    <text x="183" y="-1" font-family="monospace" font-size="9" font-weight="bold" fill="#fde047" text-anchor="middle">UPSKILLING</text>
    
    <text x="0" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">College Student Tech Mentorship</text>
    <text x="0" y="45" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#a7f3d0">LinkedIn Mastery • HackerRank • Engineering Skills</text>
  </g>
</svg>
