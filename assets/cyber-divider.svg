<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="vineRiverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0" />
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00f59b" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#14b8a6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="riverSpark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f59b" stop-opacity="0" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </linearGradient>

    <filter id="vineGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes riverCurrent {
        0% { transform: translateX(-400px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(400px); opacity: 0; }
      }
      .river-pulse {
        animation: riverCurrent 4.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <g transform="translate(450, 12)">
    <!-- Main River Vine Line -->
    <line x1="-420" y1="0" x2="420" y2="0" stroke="url(#vineRiverGrad)" stroke-width="1.8" />
    
    <!-- Moving Bioluminescent Firefly Pulse -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="url(#riverSpark)" stroke-width="2.5" filter="url(#vineGlow)" class="river-pulse" />

    <!-- Center Amazon Leaf / Jewel Node -->
    <!-- Leaf outline -->
    <path d="M 0 -8 C 8 -4, 8 4, 0 8 C -8 4, -8 -4, 0 -8 Z" fill="#042f2e" stroke="#00f59b" stroke-width="1.5" filter="url(#vineGlow)" />
    <!-- Center Firefly -->
    <circle cx="0" cy="0" r="2.8" fill="#a3e635">
      <animate attributeName="r" values="2;3.6;2" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite" />
    </circle>

    <!-- Side Leaf Flourishes -->
    <g transform="translate(-160, 0)">
      <path d="M 0 0 Q -10 -7, -18 0 Q -10 3, 0 0 Z" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="#00f59b" />
    </g>
    <g transform="translate(160, 0)">
      <path d="M 0 0 Q 10 -7, 18 0 Q 10 3, 0 0 Z" fill="#064e3b" stroke="#14b8a6" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="#14b8a6" />
    </g>

    <!-- Outer River Ripples -->
    <circle cx="-320" cy="0" r="2" fill="#10b981" opacity="0.5" />
    <circle cx="320" cy="0" r="2" fill="#14b8a6" opacity="0.5" />
  </g>
</svg>
