        <rect x="660" y="0" width="10" height="10" rx="2" fill="#047857" />
        <rect x="675" y="0" width="10" height="10" rx="2" fill="#00f59b" />
        <rect x="690" y="0" width="10" height="10" rx="2" fill="#a3e635" />
        <rect x="705" y="0" width="10" height="10" rx="2" fill="#10b981" />
        <rect x="720" y="0" width="10" height="10" rx="2" fill="#00f59b" />
        <rect x="735" y="0" width="10" height="10" rx="2" fill="#062e19" />
        <rect x="750" y="0" width="10" height="10" rx="2" fill="#047857" />
