      <g transform="translate(0, 14)">
        <rect x="0" y="0" width="820" height="70" fill="none" />
        <path d="M 0 0 L 820 0 M 0 14 L 820 14 M 0 28 L 820 28 M 0 42 L 820 42 M 0 56 L 820 56 M 0 70 L 820 70" stroke="#062e19" stroke-width="1.5" stroke-dasharray="10 5" />
      </g>
    </g>

    <!-- Animated Emerald Anaconda Snake Sprite -->
    <g class="snake-head-forest" transform="translate(140, 20)">
      <rect x="-36" y="0" width="10" height="10" rx="2" fill="#047857" />
      <rect x="-24" y="0" width="10" height="10" rx="2" fill="#10b981" />
      <rect x="-12" y="0" width="10" height="10" rx="2" fill="#00f59b" />
      <!-- Snake Head with Firefly Glow -->
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#facc15" filter="url(#forestDotGlow)" />
      <circle cx="5" cy="5" r="2" fill="#02140a" />
    </g>
  </g>

  <!-- Legend and Metric Bar -->
  <g transform="translate(30, 155)">
    <text x="0" y="0" class="forest-telemetry-txt">FOREST COMMITS: <tspan fill="#00f59b">PERSISTENT</tspan> | BIODIVERSITY VELOCITY: <tspan fill="#a3e635">HIGH</tspan></text>
    <g transform="translate(680, -8)">
      <text x="-35" y="7" class="forest-telemetry-txt">LESS</text>
      <rect x="0" y="0" width="9" height="9" rx="2" fill="#062e19" />
      <rect x="13" y="0" width="9" height="9" rx="2" fill="#047857" />
      <rect x="26" y="0" width="9" height="9" rx="2" fill="#10b981" />
      <rect x="39" y="0" width="9" height="9" rx="2" fill="#a3e635" />
      <rect x="52" y="0" width="9" height="9" rx="2" fill="#00f59b" />
      <text x="68" y="7" class="forest-telemetry-txt">MORE</text>
    </g>
  </g>
</svg>
