<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180">
  <defs>
    <linearGradient id="forestGridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021208" />
      <stop offset="100%" stop-color="#041a0d" />
    </linearGradient>

    <filter id="forestDotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes crawlSnakeForest {
        0% { transform: translate(0, 0); }
        25% { transform: translate(120px, 0); }
        50% { transform: translate(120px, 48px); }
        75% { transform: translate(260px, 48px); }
        100% { transform: translate(400px, 12px); }
      }
      .snake-head-forest {
        animation: crawlSnakeForest 8s linear infinite alternate;
      }
      .forest-telemetry-txt {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #6ee7b7;
      }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect x="2" y="2" width="876" height="176" rx="10" fill="url(#forestGridBg)" stroke="#064e3b" stroke-width="1.4" />

  <!-- Top Terminal Bar -->
  <g transform="translate(24, 24)">
    <circle cx="0" cy="0" r="4" fill="#10b981" />
    <circle cx="14" cy="0" r="4" fill="#a3e635" />
    <circle cx="28" cy="0" r="4" fill="#facc15" />
    <text x="50" y="4" class="forest-telemetry-txt">AMAZON_CONTRIBUTION_BIOSPHERE // DEV_VELOCITY: 365_DAYS // ECOSYSTEM: ACTIVE</text>
  </g>

  <!-- Visual Contribution Matrix Dots in Forest Greens -->
  <g transform="translate(30, 48)">
    <g fill="#062e19">
      <!-- Col samples with emerald & lime activity levels -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="10" height="10" rx="2" fill="#062e19" />
        <rect x="15" y="0" width="10" height="10" rx="2" fill="#047857" />
        <rect x="30" y="0" width="10" height="10" rx="2" fill="#10b981" />
        <rect x="45" y="0" width="10" height="10" rx="2" fill="#00f59b" filter="url(#forestDotGlow)" />
        <rect x="60" y="0" width="10" height="10" rx="2" fill="#a3e635" />
        <rect x="75" y="0" width="10" height="10" rx="2" fill="#062e19" />
        <rect x="90" y="0" width="10" height="10" rx="2" fill="#14b8a6" />
        <rect x="105" y="0" width="10" height="10" rx="2" fill="#00f59b" />
        <rect x="120" y="0" width="10" height="10" rx="2" fill="#10b981" />
