        <rect x="150" y="0" width="10" height="10" rx="2" fill="#047857" />
        <rect x="165" y="0" width="10" height="10" rx="2" fill="#00f59b" />
        <rect x="180" y="0" width="10" height="10" rx="2" fill="#a3e635" />
        <rect x="195" y="0" width="10" height="10" rx="2" fill="#10b981" />
        <rect x="210" y="0" width="10" height="10" rx="2" fill="#062e19" />
        <rect x="225" y="0" width="10" height="10" rx="2" fill="#00f59b" />
        <rect x="240" y="0" width="10" height="10" rx="2" fill="#14b8a6" />
        <rect x="255" y="0" width="10" height="10" rx="2" fill="#a3e635" />
        <rect x="270" y="0" width="10" height="10" rx="2" fill="#00f59b" />
        <rect x="285" y="0" width="10" height="10" rx="2" fill="#10b981" />
        <rect x="300" y="0" width="10" height="10" rx="2" fill="#062e19" />
        <rect x="315" y="0" width="10" height="10" rx="2" fill="#00f59b" />
        <rect x="330" y="0" width="10" height="10" rx="2" fill="#a3e635" />
        <rect x="345" y="0" width="10" height="10" rx="2" fill="#10b981" />
        <rect x="360" y="0" width="10" height="10" rx="2" fill="#00f59b" />
        <rect x="375" y="0" width="10" height="10" rx="2" fill="#062e19" />
        <rect x="390" y="0" width="10" height="10" rx="2" fill="#047857" />
        <rect x="405" y="0" width="10" height="10" rx="2" fill="#00f59b" />
