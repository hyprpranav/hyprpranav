<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="100%" height="140">
  <defs>
    <linearGradient id="ampBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>
    <linearGradient id="ampGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="aGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="446" height="136" rx="12" fill="url(#ampBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Tech Accent Lines -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#38bdf8" stroke-width="2" />
  <circle cx="60" cy="20" r="2" fill="#38bdf8" />

  <!-- Logo Icon: Battery & Energy Bolt -->
  <g transform="translate(48, 70)">
    <rect x="-18" y="-20" width="36" height="40" rx="6" fill="#0f172a" stroke="url(#ampGrad)" stroke-width="2" filter="url(#aGlow)" />
    <rect x="-6" y="-24" width="12" height="4" rx="2" fill="#38bdf8" />
    <polygon points="2,-12 -8,2 0,2 -2,12 8,-2 0,-2" fill="#38bdf8" filter="url(#aGlow)" />
  </g>

  <!-- Typography with clean clearance -->
  <g transform="translate(88, 48)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="2.5">AMPORA</text>
    <!-- Badge positioned cleanly with clearance after AMPORA -->
    <rect x="135" y="-14" width="96" height="18" rx="4" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="0.8" />
    <text x="183" y="-1" font-family="monospace" font-size="9" font-weight="bold" fill="#c084fc" text-anchor="middle">UPSKILLING</text>
    
    <text x="0" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Student Tech Mentorship &amp; Innovation</text>
    <text x="0" y="45" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">HackerRank • LinkedIn Mastery • Engineering Skills</text>
  </g>
</svg>
