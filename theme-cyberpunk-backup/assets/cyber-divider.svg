<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f5d4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseSpark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes travelSpark {
        0% { transform: translateX(-400px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(400px); opacity: 0; }
      }
      .spark {
        animation: travelSpark 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <g transform="translate(450, 12)">
    <!-- Base Background Line -->
    <line x1="-420" y1="0" x2="420" y2="0" stroke="url(#divGrad)" stroke-width="1.5" />
    
    <!-- Moving Energy Pulse Spark -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="url(#pulseSpark)" stroke-width="2.5" filter="url(#divGlow)" class="spark" />

    <!-- Center Node / Diamond -->
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#0b1120" stroke="#00f5d4" stroke-width="1.5" filter="url(#divGlow)" />
    <circle cx="0" cy="0" r="2.5" fill="#00f5d4">
      <animate attributeName="r" values="2;3.5;2" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Side Circuit Pips -->
    <line x1="-180" y1="-4" x2="-180" y2="4" stroke="#00b4d8" stroke-width="1.5" opacity="0.7" />
    <circle cx="-180" cy="0" r="1.5" fill="#00b4d8" />

    <line x1="180" y1="-4" x2="180" y2="4" stroke="#a855f7" stroke-width="1.5" opacity="0.7" />
    <circle cx="180" cy="0" r="1.5" fill="#a855f7" />

    <!-- Tiny side nodes -->
    <circle cx="-320" cy="0" r="2" fill="#00f5d4" opacity="0.4" />
    <circle cx="320" cy="0" r="2" fill="#a855f7" opacity="0.4" />
  </g>
</svg>
