<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <filter id="neonDotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes crawlSnake {
        0% { transform: translate(0, 0); }
        25% { transform: translate(120px, 0); }
        50% { transform: translate(120px, 48px); }
        75% { transform: translate(260px, 48px); }
        100% { transform: translate(400px, 12px); }
      }
      .snake-head {
        animation: crawlSnake 8s linear infinite alternate;
      }
      .telemetry-txt {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #64748b;
      }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect x="2" y="2" width="876" height="176" rx="10" fill="url(#gridBg)" stroke="#1a2744" stroke-width="1.2" />

  <!-- Top Terminal Bar -->
  <g transform="translate(24, 24)">
    <circle cx="0" cy="0" r="4" fill="#ff5f56" />
    <circle cx="14" cy="0" r="4" fill="#ffbd2e" />
    <circle cx="28" cy="0" r="4" fill="#27c93f" />
    <text x="50" y="4" class="telemetry-txt">HYPR_CONTRIBUTION_MATRIX // DEV_CYCLE: 365_DAYS // TELEMETRY: ACTIVE</text>
  </g>

  <!-- Visual Contribution Matrix Dots -->
  <g transform="translate(30, 48)">
    <!-- Simulated Weekly Grid of 52 Columns x 7 Rows -->
    <g fill="#161b22">
      <!-- Generated grid nodes -->
      <g id="grid-dots">
        <!-- Render representative weeks -->
        <!-- Row 1 to 7 -->
        <g transform="translate(0, 0)">
          <!-- Col samples with cyan/purple activity levels -->
          <rect x="0" y="0" width="10" height="10" rx="2" fill="#161b22" />
          <rect x="15" y="0" width="10" height="10" rx="2" fill="#0e4429" />
          <rect x="30" y="0" width="10" height="10" rx="2" fill="#005f73" />
          <rect x="45" y="0" width="10" height="10" rx="2" fill="#00f5d4" filter="url(#neonDotGlow)" />
          <rect x="60" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
          <rect x="75" y="0" width="10" height="10" rx="2" fill="#161b22" />
          <rect x="90" y="0" width="10" height="10" rx="2" fill="#a855f7" />
          <rect x="105" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="120" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
          <rect x="135" y="0" width="10" height="10" rx="2" fill="#161b22" />
          <rect x="150" y="0" width="10" height="10" rx="2" fill="#005f73" />
          <rect x="165" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="180" y="0" width="10" height="10" rx="2" fill="#a855f7" />
          <rect x="195" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
          <rect x="210" y="0" width="10" height="10" rx="2" fill="#161b22" />
          <rect x="225" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="240" y="0" width="10" height="10" rx="2" fill="#005f73" />
          <rect x="255" y="0" width="10" height="10" rx="2" fill="#a855f7" />
          <rect x="270" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="285" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
          <rect x="300" y="0" width="10" height="10" rx="2" fill="#161b22" />
          <rect x="315" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="330" y="0" width="10" height="10" rx="2" fill="#a855f7" />
          <rect x="345" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
          <rect x="360" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="375" y="0" width="10" height="10" rx="2" fill="#161b22" />
          <rect x="390" y="0" width="10" height="10" rx="2" fill="#005f73" />
          <rect x="405" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="420" y="0" width="10" height="10" rx="2" fill="#a855f7" />
          <rect x="435" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
          <rect x="450" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="465" y="0" width="10" height="10" rx="2" fill="#161b22" />
          <rect x="480" y="0" width="10" height="10" rx="2" fill="#005f73" />
          <rect x="495" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="510" y="0" width="10" height="10" rx="2" fill="#a855f7" />
          <rect x="525" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
          <rect x="540" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="555" y="0" width="10" height="10" rx="2" fill="#161b22" />
          <rect x="570" y="0" width="10" height="10" rx="2" fill="#005f73" />
          <rect x="585" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="600" y="0" width="10" height="10" rx="2" fill="#a855f7" />
          <rect x="615" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
          <rect x="630" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="645" y="0" width="10" height="10" rx="2" fill="#161b22" />
          <rect x="660" y="0" width="10" height="10" rx="2" fill="#005f73" />
          <rect x="675" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="690" y="0" width="10" height="10" rx="2" fill="#a855f7" />
          <rect x="705" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
          <rect x="720" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="735" y="0" width="10" height="10" rx="2" fill="#161b22" />
          <rect x="750" y="0" width="10" height="10" rx="2" fill="#005f73" />
          <rect x="765" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
          <rect x="780" y="0" width="10" height="10" rx="2" fill="#a855f7" />
          <rect x="795" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
          <rect x="810" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
        </g>
        <!-- Additional rows filled consistently -->
        <g transform="translate(0, 14)">
          <rect x="0" y="0" width="820" height="70" fill="none" />
          <!-- Repeating grid matrix pattern -->
          <path d="M 0 0 L 820 0 M 0 14 L 820 14 M 0 28 L 820 28 M 0 42 L 820 42 M 0 56 L 820 56 M 0 70 L 820 70" stroke="#101726" stroke-width="1.5" stroke-dasharray="10 5" />
        </g>
      </g>
    </g>

    <!-- Animated Neon Snake Cyber Sprite -->
    <g class="snake-head" transform="translate(140, 20)">
      <!-- Snake Tail -->
      <rect x="-36" y="0" width="10" height="10" rx="2" fill="#005f73" />
      <rect x="-24" y="0" width="10" height="10" rx="2" fill="#00b4d8" />
      <rect x="-12" y="0" width="10" height="10" rx="2" fill="#00f5d4" />
      <!-- Snake Head with Glow -->
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#ffffff" filter="url(#neonDotGlow)" />
      <circle cx="5" cy="5" r="2" fill="#00f5d4" />
    </g>
  </g>

  <!-- Legend and Metric Bar -->
  <g transform="translate(30, 155)">
    <text x="0" y="0" class="telemetry-txt">ENGINEERING COMMITS: <tspan fill="#00f5d4">PERSISTENT</tspan> | R&amp;D VELOCITY: <tspan fill="#a855f7">HIGH</tspan></text>
    <g transform="translate(680, -8)">
      <text x="-35" y="7" class="telemetry-txt">LESS</text>
      <rect x="0" y="0" width="9" height="9" rx="2" fill="#161b22" />
      <rect x="13" y="0" width="9" height="9" rx="2" fill="#005f73" />
      <rect x="26" y="0" width="9" height="9" rx="2" fill="#00b4d8" />
      <rect x="39" y="0" width="9" height="9" rx="2" fill="#a855f7" />
      <rect x="52" y="0" width="9" height="9" rx="2" fill="#00f5d4" />
      <text x="68" y="7" class="telemetry-txt">MORE</text>
    </g>
  </g>
</svg>
