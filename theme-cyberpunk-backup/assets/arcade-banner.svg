<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="170">
  <defs>
    <linearGradient id="arcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="50%" stop-color="#120e2e" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <linearGradient id="neonPinkCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="arcGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#251b4d" stroke-width="0.75" />
    </pattern>

    <style>
      @keyframes neonFlicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 0.95; }
        93% { opacity: 0.6; }
        94% { opacity: 1; }
        96% { opacity: 0.8; }
        98% { opacity: 1; }
      }
      @keyframes thrust {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .flicker {
        animation: neonFlicker 5s infinite;
      }
      .ship {
        animation: thrust 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="166" rx="14" fill="url(#arcBg)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6" />
  <rect x="4" y="4" width="892" height="162" rx="12" fill="url(#arcGrid)" opacity="0.6" />

  <!-- Corner Flairs -->
  <path d="M 12 30 L 12 12 L 30 12" stroke="#00f5d4" stroke-width="2" fill="none" />
  <path d="M 888 30 L 888 12 L 870 12" stroke="#ff007f" stroke-width="2" fill="none" />
  <path d="M 12 140 L 12 158 L 30 158" stroke="#ff007f" stroke-width="2" fill="none" />
  <path d="M 888 140 L 888 158 L 870 158" stroke="#00f5d4" stroke-width="2" fill="none" />

  <!-- Spaceship Vector Graphic -->
  <g transform="translate(80, 85)" class="ship">
    <polygon points="-40,-6 -62,0 -40,6 -48,0" fill="#00f5d4" filter="url(#arcGlow)">
      <animate attributeName="points" values="-40,-6 -65,0 -40,6 -48,0;-40,-5 -55,0 -40,5 -46,0;-40,-6 -65,0 -40,6 -48,0" dur="0.2s" repeatCount="indefinite" />
    </polygon>
    <polygon points="-30,-18 35,0 -30,18 -15,0" fill="#0f172a" stroke="#00f5d4" stroke-width="2" />
    <polygon points="-20,-24 -5,-12 -25,-10" fill="#a855f7" />
    <polygon points="-20,24 -5,12 -25,10" fill="#a855f7" />
    <ellipse cx="2" cy="0" rx="9" ry="4" fill="#00f5d4" filter="url(#arcGlow)" />
    <circle cx="65" cy="-8" r="3" fill="#ff007f" filter="url(#arcGlow)" />
    <circle cx="95" cy="8" r="3" fill="#00f5d4" filter="url(#arcGlow)" />
  </g>

  <!-- Title & Info (Constrained width so it NEVER touches the button) -->
  <g transform="translate(190, 48)">
    <rect x="0" y="-18" width="130" height="20" rx="4" fill="#ff007f" fill-opacity="0.2" stroke="#ff007f" stroke-width="1" />
    <text x="65" y="-4" fill="#ff70a6" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1.5">INTERACTIVE LAB</text>
    
    <text x="0" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="url(#neonPinkCyan)" filter="url(#arcGlow)" letter-spacing="3" class="flicker">HYPR ARCADE</text>
    
    <!-- Multi-line text with ample right-side clearance -->
    <text x="0" y="52" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12.5" fill="#e2e8f0" letter-spacing="0.5">
      Space Interceptor &amp; Kinetic Hyperloop Defense
    </text>
    <text x="0" y="70" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="11.5" fill="#94a3b8" letter-spacing="0.5">
      Pure HTML5 Canvas Engine • Real-time Web Audio Synthesizer
    </text>
  </g>

  <!-- Call-to-Action Arcade Coin Slot / Button -->
  <g transform="translate(750, 85)">
    <rect x="-85" y="-26" width="170" height="52" rx="26" fill="#131b2e" stroke="url(#neonPinkCyan)" stroke-width="2" filter="url(#arcGlow)" />
    <polygon points="-45,-7 -45,7 -32,0" fill="#00f5d4" />
    <text x="12" y="6" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14" text-anchor="middle" letter-spacing="1.5">PLAY NOW</text>
    <text x="62" y="6" fill="#00f5d4" font-family="sans-serif" font-weight="bold" font-size="15">→</text>
  </g>
</svg>
